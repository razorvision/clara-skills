name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Gate script tests
        run: node --test scripts/checks.test.mjs
      - name: License consistency
        run: node scripts/check-license.mjs .
      - name: Router coverage
        run: node scripts/check-router.mjs .
      - name: Reference and MCP URL consistency
        run: node scripts/check-consistency.mjs .
      - name: Version sync
        run: node scripts/check-version.mjs sync .
      - name: Version bump
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A fork chooses its own branch names, so only a same-repo branch can claim the release exemption.
          HEAD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
        run: node scripts/check-version.mjs bump . "$BASE_SHA"

  skills-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the Agent Skills reference validator
        run: pip install skills-ref==0.1.1
      - name: Validate every skill
        run: |
          status=0
          for dir in skills/*/; do
            agentskills validate "$dir" || status=1
          done
          exit $status

  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate the marketplace and plugin
        run: npx -y @anthropic-ai/claude-code@2.1.296 plugin validate . --strict
